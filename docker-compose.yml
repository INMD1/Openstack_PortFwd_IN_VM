  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # PostgreSQL (필요시 주석 해제)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: skyline_portfwd
