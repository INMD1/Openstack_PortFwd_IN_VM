  #     POSTGRES_PASSWORD: skyline_password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  sqlite_data:
  # postgres_data:

networks:
  default:
    name: portfwd_network
